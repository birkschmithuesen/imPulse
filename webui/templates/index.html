<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>imPulse &ndash; Fernsteuerung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="titles">
      <h1>imPulse</h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="actions">
      <label class="switch" title="Skaliert lifetime, nodeDeadTime und randomSpawn/interval mit, wenn /net/impulse/speed geaendert wird">
        <input type="checkbox" id="coupling">
        <span>Speed-Kopplung aktiv</span>
      </label>
      <button type="button" id="reload" title="remoteSettings.txt neu einlesen (nach einem imPulse-Neustart)">Neu laden</button>
    </div>
  </header>

  <p class="status" id="status" role="status">&nbsp;</p>

  <section class="presets" id="presets">
    <h2>Presets</h2>
    <div class="preset-rows">
      <div class="preset-row">
        <select id="presetSelect" aria-label="Preset auswaehlen"></select>
        <button type="button" id="presetLoad" title="Gewaehltes Preset laden (/preset/load)">Laden</button>
      </div>
      <div class="preset-row">
        <input type="text" id="presetName" placeholder="neuer-preset-name" maxlength="64"
               autocomplete="off" spellcheck="false" aria-label="Name fuer das neue Preset">
        <button type="button" id="presetSave" title="Aktuelle Werte unter diesem Namen speichern (/preset/save)">Speichern</button>
      </div>
    </div>
  </section>

  <!-- Fuenf Themen-Tabs. Die Zuordnung kommt vom Server (TABS in
       server.py); app.js baut ALLE Panels und schaltet nur die
       Sichtbarkeit um, damit Preset-Laden und der applied/echoed-Ruecklauf
       auch Regler auf inaktiven Tabs erreichen. -->
  <nav class="tab-bar" id="tabBar" role="tablist"></nav>
  <main id="tabPanels"></main>

  <!-- Rueckfall fuer einen aelteren Server ohne Tab-Daten, siehe
       buildTabs() in app.js. -->
  <div id="groups" hidden></div>

  <script type="application/json" id="bootstrap">{{ bootstrap|safe }}</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
